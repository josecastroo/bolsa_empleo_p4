<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Dashboard Candidato</title>
    <link rel="stylesheet" th:href="@{/styles/candidato/dashboard.css}" href="dashboard-candidato.css" />
</head>
<body>
<div class="page-wrapper">

    <!-- Alerts -->
    <div class="alert alert-danger" th:if="${param.yaAplico}">
        ✕ Ya aplicaste a este puesto.
    </div>
    <div class="alert alert-success" th:if="${param.success}">
        ✓ Aplicación enviada correctamente.
    </div>

    <!-- Header -->
    <div class="page-header">
        <div class="page-header-text">
            <h2 th:text="'Bienvenido, ' + ${candidato.firstName}"></h2>
            <p>Dashboard del candidato</p>
        </div>
        <div class="header-links">
            <a class="btn-link" href="/candidato/habilidades">Mis habilidades</a>
            <a class="btn-link" href="/candidato/aplicaciones">Mis aplicaciones</a>
        </div>
    </div>

    <!-- CV upload -->
    <div class="cv-card">
        <div>
            <div class="cv-label">Currículum (CV)</div>
            <div class="cv-hint">Solo PDF · Se reemplaza el anterior</div>
        </div>
        <form class="cv-actions" th:action="@{/candidato/cv}" method="post" enctype="multipart/form-data">
            <label class="file-input-label" for="cvFile">Seleccionar archivo</label>
            <input type="file" id="cvFile" name="file" accept="application/pdf" required />
            <button class="btn-primary" type="submit">Subir CV</button>
        </form>
    </div>

    <!-- Oportunidades -->
    <h2 class="section-title">Mis oportunidades</h2>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Puesto</th>
                <th>Salario</th>
                <th>Match %</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${matches}">

                <td class="td-puesto" th:text="${entry.key.description}"></td>

                <td class="td-salary" th:text="${entry.key.salary}"></td>

                <td>
                    <div class="match-cell">
                        <div class="match-bar-bg">
                            <div class="match-bar-fill"
                                 th:style="'width:' + ${entry.value} + '%'"></div>
                        </div>
                        <span class="match-value"
                              th:text="${#numbers.formatDecimal(entry.value, 0, 2)} + '%'"></span>
                    </div>
                </td>

                <td>
                    <a class="btn-apply"
                       th:href="@{'/candidato/aplicar/' + ${entry.key.id}}">Aplicar</a>
                </td>

            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
