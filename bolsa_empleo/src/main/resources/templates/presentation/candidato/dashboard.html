<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard Candidato</title>
</head>
<body>

<h2>Dashboard Candidato</h2>

<h3 th:text="'Bienvenido ' + ${candidato.firstName}"></h3>

<a href="/candidato/habilidades">Agregar habilidades</a>
<hr/>
<a href="/candidato/aplicaciones">Ver mis aplicaciones</a>

<h2>Mis oportunidades</h2>

<table border="1">
    <tr>
        <th>Puesto</th>
        <th>Salario</th>
        <th>Match %</th>
    </tr>

    <tr th:each="entry : ${matches}">
        <td th:text="${entry.key.description}"></td>
        <td th:text="${entry.key.salary}"></td>
        <td th:text="${#numbers.formatDecimal(entry.value, 0, 2)} + '%'"></td>
        <td>
            <a th:href="@{'/candidato/aplicar/' + ${entry.key.id}}">
                Aplicar
            </a>
        </td>
    </tr>
</table>

<p th:if="${param.yaAplico}" style="color:red">
    Ya aplicaste a este puesto
</p>

<p th:if="${param.success}" style="color:green">
    Aplicación enviada correctamente
</p>

</body>
</html>
