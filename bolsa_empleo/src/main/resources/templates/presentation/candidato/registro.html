<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Registro Candidato</title>
    <link rel="stylesheet" th:href="@{/styles/candidato/registro.css}" href="registro-candidato.css" />
</head>
<body>

<div class="form-wrapper">

    <div class="form-header">
        <h2>Registro Candidato</h2>
        <p>Completá el formulario para crear tu cuenta</p>
    </div>

    <div class="card">
        <form th:action="@{/candidato/registro}" th:object="${candidato}" method="post">

            <!-- Identificación (fila completa) -->
            <div class="field">
                <label>Identificación</label>
                <input type="text" th:field="*{identification}" required placeholder="Número de identificación" />
            </div>

            <!-- Nombre + Apellido -->
            <div class="field-row">
                <div class="field">
                    <label>Nombre</label>
                    <input type="text" th:field="*{firstName}" required placeholder="Nombre" />
                </div>
                <div class="field">
                    <label>Apellido</label>
                    <input type="text" th:field="*{lastName}" required placeholder="Apellido" />
                </div>
            </div>

            <!-- Nacionalidad + Residencia -->
            <div class="field-row">
                <div class="field">
                    <label>Nacionalidad</label>
                    <input type="text" th:field="*{nationality}" required placeholder="Ej: Costarricense" />
                </div>
                <div class="field">
                    <label>Residencia</label>
                    <input type="text" th:field="*{residence}" required placeholder="Ciudad, País" />
                </div>
            </div>

            <!-- Teléfono + Email -->
            <div class="field-row">
                <div class="field">
                    <label>Teléfono</label>
                    <input type="text" th:field="*{phone}" required placeholder="+506 0000-0000" />
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required placeholder="correo@ejemplo.com" />
                </div>
            </div>

            <hr class="divider" />

            <!-- Contraseña -->
            <div class="field">
                <label>Contraseña</label>
                <input type="password" th:field="*{password}" required placeholder="••••••••" />
            </div>

            <!-- Hidden -->
            <input type="hidden" th:field="*{approved}" value="true" />

            <button class="btn-primary" type="submit">Crear cuenta</button>

        </form>
    </div>

</div>
</body>
</html>
