<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Habilidades</title>
    <link rel="stylesheet" th:href="@{/styles/candidato/habilidades.css}" href="habilidades.css" />
</head>
<body>
<div class="page-wrapper">

    <h2>Mis habilidades</h2>

    <form th:action="@{/candidato/habilidades}" method="post">

        <div class="card">
            <div class="caracteristica-row" th:each="c : ${caracteristicas}">
                <input type="checkbox" name="caracteristicaIds" th:value="${c.id}" />
                <span class="caracteristica-name" th:text="${c.name}"></span>
                <span class="nivel-label">Nivel</span>
                <input class="nivel-input" type="number" name="niveles" min="1" max="5" placeholder="1" />
            </div>
        </div>

        <button class="btn-primary" type="submit">Guardar</button>

    </form>

</div>
</body>
</html>
