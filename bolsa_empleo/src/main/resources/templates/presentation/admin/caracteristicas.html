<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Características — JobBoard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles/admin/caracteristicas.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="nav-logo" th:href="@{/}" href="/">Bolsa<span>Empleo</span></a>
</nav>

<main>

  <h2 class="page-title">Características</h2>

  <!-- Crear nueva -->
  <div class="card">
    <div class="card-title">Crear nueva</div>

    <form method="post" th:action="@{/admin/caracteristicas}">

      <div class="form-group">
        <input type="text" name="name" placeholder="Nombre" required>
      </div>

      <div class="form-group">
        <select name="parentId">
          <option value="">Sin padre</option>
          <option th:each="c : ${caracteristicas}"
                  th:value="${c.id}"
                  th:text="${c.name}">
          </option>
        </select>
      </div>

      <button type="submit" class="btn-guardar">Guardar</button>

    </form>
  </div>

  <!-- Lista -->
  <div class="card">
    <div class="card-title">Lista</div>

    <ul class="lista">
      <li th:each="c : ${caracteristicas}">
        <span th:text="${c.name}">Nombre</span>
        <span th:if="${c.parent != null}"
              class="padre-badge"
              th:text="${c.parent.name}">Padre</span>
      </li>
    </ul>
  </div>

</main>

<footer>
  <p>© 2025 <span>Bolsa Empleo</span></p>
</footer>

</body>
</html>
