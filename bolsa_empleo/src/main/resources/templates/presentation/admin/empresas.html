<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empresas — Admin</title>
    <link rel="stylesheet" th:href="@{/styles/admin/empresas.css}"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-spacer"></div>
    <span class="navbar-badge">Admin</span>
</nav>

<!-- Page content -->
<div class="page-wrapper">

    <!-- Header -->
    <div class="page-header">
        <h1>Empresas</h1>
        <p>Gestión y aprobación de empresas registradas en la plataforma</p>
    </div>

    <div class="table-wrapper">
        <div class="table-header">
            <span class="table-header-title">Listado de empresas</span>
        </div>

        <table>
            <thead>
            <tr>
                <th>Empresa</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>

            <tr th:if="${#lists.isEmpty(empresas)}">
                <td colspan="3">
                    <div class="empty-state">
                        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                  d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
                        </svg>
                        <p>No hay empresas registradas.</p>
                    </div>
                </td>
            </tr>

            <tr th:each="e : ${empresas}">

                <td>
                    <div class="company-cell">
                        <div class="company-logo"
                             th:text="${#strings.substring(e.name, 0, 2)}">EM</div>
                        <div>
                            <div class="company-name" th:text="${e.name}">Empresa</div>
                            <div class="company-email" th:text="${e.email}">correo@empresa.com</div>
                        </div>
                    </div>
                </td>

                <td>
                    <span th:if="${e.approved}" class="badge badge-success">Aprobada</span>
                    <span th:if="${!e.approved}" class="badge badge-warning">Pendiente</span>
                </td>

                <td>
                    <div class="actions-cell">
                        <th:block th:if="${!e.approved}">
                            <a class="btn-approve"
                               th:href="@{'/admin/empresa/' + ${e.id} + '/aprobar'}">
                                ✓ Aprobar
                            </a>
                            <a class="btn-reject"
                               th:href="@{'/admin/empresa/' + ${e.id} + '/rechazar'}">
                                ✕ Rechazar
                            </a>
                        </th:block>

                        <span th:if="${e.approved}" class="approved-check">
                ✓ Verificada
              </span>
                    </div>
                </td>

            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
