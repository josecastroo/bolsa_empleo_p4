<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Registro Empresa</title>
    <link rel="stylesheet" th:href="@{/styles/empresa/registro.css}" href="registro-empresa.css" />
</head>
<body>

<div class="form-wrapper">

    <div class="form-header">
        <h2>Registro de Empresa</h2>
        <p>Completá el formulario para crear tu cuenta</p>
    </div>

    <div class="card">
        <form th:action="@{/empresa/registro}" th:object="${empresa}" method="post">

            <!-- Nombre + Ubicación -->
            <div class="field-row">
                <div class="field">
                    <label>Nombre</label>
                    <input type="text" th:field="*{name}" required placeholder="Nombre de la empresa" />
                </div>
                <div class="field">
                    <label>Ubicación</label>
                    <input type="text" th:field="*{location}" required placeholder="Ciudad, País" />
                </div>
            </div>

            <!-- Email + Teléfono -->
            <div class="field-row">
                <div class="field">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required placeholder="correo@empresa.com" />
                </div>
                <div class="field">
                    <label>Teléfono</label>
                    <input type="text" th:field="*{phone}" required placeholder="+506 0000-0000" />
                </div>
            </div>

            <!-- Descripción -->
            <div class="field">
                <label>Descripción</label>
                <textarea th:field="*{description}" placeholder="Contanos sobre tu empresa..."></textarea>
            </div>

            <hr class="divider" />

            <!-- Contraseña -->
            <div class="field">
                <label>Contraseña</label>
                <input type="password" th:field="*{password}" required placeholder="••••••••" />
            </div>

            <button class="btn-primary" type="submit">Crear cuenta</button>

        </form>
    </div>

</div>
</body>
</html>
