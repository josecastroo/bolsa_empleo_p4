<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Crear puesto</title>
</head>

<body>
    <h2>Crear Puesto</h2>

    <form th:action="@{/empresa/puesto}" th:object="${puesto}" method="post">

        <label>Descripción:</label>
        <textarea th:field="*{description}" required></textarea><br>

        <label>Salario:</label>
        <input type="number" step="0.01" th:field="*{salary}" required><br>

        <label>Tipo:</label>
        <select th:field="*{type}">
            <option value="PUBLIC">PUBLIC</option>
            <option value="PRIVATE">PRIVATE</option>
        </select><br>

        <h3>Características requeridas</h3>

        <div th:each="c : ${caracteristicas}">
            <label>
                <input type="checkbox" name="caracteristicaIds" th:value="${c.id}">
                <span th:text="${c.name}"></span>
            </label>

            Nivel:
            <input type="number" name="niveles" min="1" max="5">
            <br>
        </div>

        <button type="submit">Crear</button>

    </form>
</body>

</html>
