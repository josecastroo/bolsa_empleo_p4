<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Empresa</title>
  <link rel="stylesheet" th:href="@{/styles/empresa/dashboard.css}" href="dashboard-empresa.css" />
</head>
<body>
<div class="page-wrapper">


  <div class="page-header">
    <h2 th:text="'Bienvenido, ' + ${empresa.name}"></h2>
    <a class="btn-primary" href="/empresa/puesto/nuevo">+ Crear puesto</a>
  </div>

  <div class="banner-pending" th:if="${!empresa.approved}">
    ⚠ Tu cuenta está pendiente de aprobación.
  </div>


  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Descripción</th>
        <th>Salario</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${puestos}">

        <td class="td-id" th:text="${p.id}"></td>

        <td class="td-desc" th:text="${p.description}"></td>

        <td class="td-salary" th:text="${p.salary}"></td>

        <td>
          <span class="badge badge-gray" th:text="${p.type}"></span>
        </td>

        <td>
          <span class="badge badge-success" th:if="${p.active}">Activo</span>
          <span class="badge badge-muted" th:unless="${p.active}">Inactivo</span>
        </td>

        <td>
          <div class="actions-cell">
            <a th:href="@{'/empresa/puesto/' + ${p.id} + '/toggle'}"
               th:class="${p.active} ? 'btn-toggle-on' : 'btn-toggle-off'"
               th:text="${p.active} ? 'Desactivar' : 'Activar'"></a>

            <a class="btn-link"
               th:href="@{'/empresa/puesto/' + ${p.id} + '/candidatos'}">Ver candidatos</a>

            <a class="btn-link"
               th:href="@{'/empresa/puesto/' + ${p.id} + '/aplicaciones'}">Ver aplicaciones</a>
          </div>
        </td>

      </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
